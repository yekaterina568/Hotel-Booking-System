spring:
  application:
    name: Hotel-Booking-System
  security:
    user:
      name: ${HOTEL_AUTH_USERNAME}
      password: ${HOTEL_AUTH_PASSWORD}
      roles: ADMIN
  datasource:
    url: jdbc:postgresql://localhost:${HOTEL_POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  cache:
    type: caffeine
    cache-names:
      - bookings
      - bookingArchive
      - guests
      - rooms
      - keycards
      - refunds
    caffeine:
      spec: "maximumSize=1000,expireAfterWrite=2m,recordStats"

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
  error:
    # Show the reason of a ResponseStatusException (e.g. "room is already booked") to the frontend
    include-message: always

hotel:
  reporting-zone: ${HOTEL_REPORTING_ZONE:Asia/Almaty}
  frontend-origins: ${HOTEL_FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
